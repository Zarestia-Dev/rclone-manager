[package]
name = "rclone-manager"
version = "0.3.3"
description = "RClone Manager is a user-friendly GUI for Rclone, designed to simplify the process of managing and transferring files across various cloud storage services. With its intuitive interface, users can easily configure and execute Rclone commands without needing extensive technical knowledge."
authors = ["Hakan İSMAİL"]
edition = "2024"
default-run = "rclone-manager"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "rclone_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dependencies]
bridge-macro = { path = "crates/bridge-macro" }
tauri = { version = "2", optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
zip = "8"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream", "query"] }
once_cell = "1"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
which = "8"
walkdir = "2"
sha2 = "0.11"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
netstat2 = "0.11"
sysinfo = "0.39"
tokio-cron-scheduler = "0.15"
croner = "4"
clap = { version = "4", features = ["derive", "env"] }
lofty = "0.25"
base64 = "0.23"
url = "2"
handlebars = "6"
rumqttc = "0.25"
rustls-native-certs = "0.8"
rustls = { version = "0.23", features = ["ring"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
sys-locale = "0.3"
dirs = "6"

tauri-plugin-dialog = { version = "2", optional = true, default-features = false }
tauri-plugin-clipboard-manager = { version = "2", optional = true, default-features = false }
tauri-plugin-notification = { version = "2", optional = true, default-features = false }
tauri-plugin-deep-link = { version = "2", optional = true, default-features = false }
tauri-plugin-os = { version = "2", optional = true, default-features = false }
tauri-plugin-opener = { version = "2", optional = true, default-features = false }

# rcman - Rust Config Manager library
rcman = { version = "0.2", features = ["backup", "derive", "profiles", "keychain", "encrypted-file"] }

urlencoding = "2"
futures = "0.3"
http = "1"
tokio-util = { version = "0.7", features = ["io"] }
mime_guess = "2"
parking_lot = "0.12"
notify = "8"

# Web server dependencies (optional)
axum = { version = "0.8", features = ["multipart"], optional = true }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"], optional = true }
async-stream = { version = "0.3", optional = true }
axum-server = { version = "0.8", features = ["tls-rustls"], optional = true }
anyhow = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", optional = true }
futures-lite = { version = "2", optional = true }
notify-rust = { version = "4", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"], optional = true }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Networking_Connectivity"] }
winreg = "0.56"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-window-state = { version = "2", optional = true, default-features = false }
tauri-plugin-updater = { version = "2", features = ["rustls-tls"], optional = true, default-features = false }

[features]
# Application builds. Server/mobile builds require --no-default-features.
default = ["desktop", "tray"]
desktop = [
    "shared-tauri",
    "tauri-plugin-window-state",
    "tauri-plugin-autostart",
    "tauri-plugin-single-instance",
    "tauri/devtools",
    "updater",
    "dep:zbus",
    "dep:futures-lite",
    "dep:objc2",
    "dep:objc2-foundation",
]
mobile = ["shared-tauri", "librclone"]
web-server = ["dep:axum", "dep:tower-http", "dep:async-stream", "dep:axum-server", "dep:anyhow"]

# Distribution variants retain all default desktop functionality.
portable = ["desktop", "tray"]
flatpak = ["desktop", "tray"]

# Optional native integrations, also usable with the web server.
tray = [
    "native-tauri",
    "tauri/tray-icon",
    "tauri/image-png",
    "tauri-plugin-opener",
    "tauri-plugin-autostart",
    "tauri-plugin-single-instance",
]
updater = ["native-tauri", "dep:tauri-plugin-updater"]

# Internal dependency groups. Keep plugin feature names used by Rust cfgs.
native-tauri = ["dep:tauri", "dep:tauri-build"]
shared-tauri = [
    "native-tauri",
    "dep:tauri-plugin-dialog",
    "tauri-plugin-dialog/xdg-portal",
    "tauri-plugin-notification",
    "tauri-plugin-deep-link",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-os",
    "tauri-plugin-opener",
]
tauri-plugin-notification = ["dep:tauri-plugin-notification", "dep:notify-rust"]

# In-process rclone via librclone FFI (mobile target).
librclone = []
# Opt-in mock runtime without pulling Tauri into server tests.
tauri-test = ["native-tauri", "tauri/test"]

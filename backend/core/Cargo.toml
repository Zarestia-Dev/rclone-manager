[package]
name = "rclone-manager-core"
version.workspace = true
edition.workspace = true
links = "rclone"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "multipart", "stream", "query"] }
log = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
which = "8"
walkdir = "2"
sha2 = "0.11"
tempfile = { workspace = true }
uuid = { workspace = true }
thiserror = "2"
netstat2 = "0.11"
sysinfo = "0.39"
tokio-cron-scheduler = "0.15"
croner = "4"
clap = { workspace = true }
lofty = "0.25"
base64 = { workspace = true }
url = "2"
handlebars = "6"
rumqttc = "0.25"
rustls-native-certs = "0.8"
rustls = { workspace = true }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
sys-locale = "0.3"
dirs = { workspace = true }

# rcman - Rust Config Manager library
rcman = { workspace = true, features = ["json", "backup", "derive", "profiles", "keychain", "encrypted-file", "vault"] }

urlencoding = "2"
futures = { workspace = true }
http = "1"
tokio-util = { workspace = true }
mime_guess = { workspace = true }
# Keep per-call recursive reads for librclone cancellation; 0.13 removes this API.
parking_lot = "0.12"
minisign-verify = { version = "0.3", optional = true }
notify = "8"


[target.'cfg(unix)'.dependencies]
libc = "0.2"
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString"], optional = true }
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_Foundation", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Networking_Connectivity"] }
winreg = "0.56"


[features]
default = []
desktop = ["dep:zbus", "dep:objc2", "dep:objc2-foundation"]
mobile = ["librclone"]
tray = []
updater = ["dep:minisign-verify"]
notifications = []
autostart = []
portable = []
flatpak = ["dep:zbus"]
librclone = []

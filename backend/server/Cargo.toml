[package]
name = "rclone-manager-server"
version.workspace = true
edition.workspace = true
default-run = "rclone-manager-server"

[[bin]]
name = "rclone-manager-server"
path = "src/main.rs"

[target.'cfg(windows)'.build-dependencies]
tauri-winres = "0.3"

[dependencies]
rclone-manager-core = { path = "../core", default-features = false, features = ["updater"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }
async-stream = "0.3"
axum-server = { version = "0.8", features = ["tls-rustls"] }
anyhow = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
rustls = { workspace = true }
uuid = { workspace = true }
tokio-util = { workspace = true }
mime_guess = { workspace = true }
dirs = { workspace = true }
clap = { workspace = true }
async-trait = { workspace = true }
tempfile = { workspace = true }
percent-encoding = "2"

[dev-dependencies]
rcman = { workspace = true, features = ["json", "backup"] }
tower = { version = "0.5", features = ["util"] }

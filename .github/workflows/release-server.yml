name: "Release Server"

on:
  workflow_dispatch:

permissions:
  contents: read

# Shares the release tag with tray packages, but has no dependency on their builds.
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.metadata.outputs.PRERELEASE }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Read release version
        id: metadata
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.headless.json
      - name: Check release versions
        id: version
        shell: python
        run: |
          import json, os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('backend/Cargo.toml').read_text())['workspace']['package']['version']
          native = json.loads(Path('backend/desktop/tauri.conf.headless.json').read_text())['version']
          if version != native:
              raise SystemExit(f'Server version {version} differs from tray version {native}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')

  build-server:
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            os: linux
            arch: x86_64
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            os: linux
            arch: aarch64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            os: windows
            arch: aarch64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            os: macos
            arch: x86_64
          - runner: macos-15
            target: aarch64-apple-darwin
            os: macos
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install server build dependencies (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./backend -> target"
          key: server-${{ matrix.target }}
      - name: Build browser UI
        run: |
          npm ci
          npm run build
      - name: Build standalone server
        run: cargo build --locked --release --manifest-path backend/Cargo.toml -p rclone-manager-server --target ${{ matrix.target }}
      - name: Prepare signed standalone server executable
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_OS: ${{ matrix.os }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_TARGET: ${{ matrix.target }}
          UPDATE_VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          binary=rclone-manager-server
          if [ "$UPDATE_OS" = windows ]; then binary="$binary.exe"; fi
          node scripts/create-update-manifest.cjs server "$UPDATE_OS" "$UPDATE_ARCH" "$UPDATE_VERSION" "backend/target/$UPDATE_TARGET/release/$binary" artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error

  upload-server:
    needs: [release-metadata, build-server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-headless
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: artifacts
      - name: Ensure release tag exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: headless-v${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Release tag $TAG already exists"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f "ref=refs/tags/$TAG" \
              -f "sha=$GITHUB_SHA"
          fi
      - name: Prepare shared draft release
        uses: actions/github-script@v8
        env:
          VERSION: ${{ needs.release-metadata.outputs.version }}
          PRERELEASE: ${{ needs.release-metadata.outputs.prerelease }}
        with:
          script: |
            const tag = `headless-v${process.env.VERSION}`;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              ...context.repo, per_page: 100,
            });
            const existing = releases.find(release => release.tag_name === tag);
            if (existing) {
              if (!existing.draft) throw new Error(`Refusing to replace published release ${tag}`);
              await github.rest.repos.updateRelease({
                ...context.repo, release_id: existing.id,
                prerelease: process.env.PRERELEASE === 'true',
              });
              return existing.id;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `RClone Manager Headless v${process.env.VERSION}`,
              body: [
                '## Server',
                '`server-<os>-<arch>-<version>` executables contain the standalone web server with embedded browser UI, translations, and templates (.exe on Windows).',
                'Linux, Windows, and macOS: x86_64 and aarch64. No Tauri or desktop session required.',
                'Linux: glibc 2.35+ and the D-Bus runtime library; FUSE is needed for mounts.',
                'Download the executable for your OS and architecture. On Linux/macOS, run chmod +x on the downloaded file before starting it.',
                '',
                '## Server + Tray',
                'The rclone-manager-headless native installers include a tray and native updater.',
                'These require desktop runtime libraries and a display session on Linux.',
                '',
                'Stop standalone services before replacing the executable. Preserve application data.',
              ].join('\n'),
              draft: true,
              prerelease: process.env.PRERELEASE === 'true',
            });
            return data.id;

      - name: Attach server executables to the shared draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release-metadata.outputs.version }}
        run: |
          set -euo pipefail
          tag="headless-v$VERSION"
          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != true ]; then
            echo "Refusing to change a published release" >&2
            exit 1
          fi
          find artifacts -type f ! -name updater.json -exec gh release upload "$tag" --clobber {} +
          node scripts/publish-custom-updater.cjs "$tag" "$VERSION" artifacts

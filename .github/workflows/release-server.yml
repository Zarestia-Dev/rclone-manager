name: 'Release Server'

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-server:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            os: 'linux'
            arch: 'x86_64'
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-22.04-arm'
            os: 'linux'
            arch: 'aarch64'
            rust_target: 'aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            os: 'windows'
            arch: 'x86_64'
            rust_target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-11-arm'
            os: 'windows'
            arch: 'aarch64'
            rust_target: 'aarch64-pc-windows-msvc'
          - platform: 'macos-15-intel'
            os: 'macos'
            arch: 'x86_64'
            rust_target: 'x86_64-apple-darwin'
          - platform: 'macos-15'
            os: 'macos'
            arch: 'aarch64'
            rust_target: 'aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libssl-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          key: server-${{ matrix.os }}-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm install

      - name: Get Version
        id: get_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.headless.json

      - name: Build browser UI
        run: npm run build

      - name: Build standalone server
        run: cargo build --locked --release --manifest-path backend/Cargo.toml -p rclone-manager-server --target ${{ matrix.rust_target }}

      - name: Sign server executable
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_OS: ${{ matrix.os }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_TARGET: ${{ matrix.rust_target }}
          UPDATE_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          binary=rclone-manager-server
          if [ "$UPDATE_OS" = windows ]; then binary="$binary.exe"; fi
          node scripts/create-update-manifest.cjs server "$UPDATE_OS" "$UPDATE_ARCH" "$UPDATE_VERSION" "backend/target/$UPDATE_TARGET/release/$binary" updater-assets

      - name: Collect server release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: server-${{ matrix.os }}-${{ matrix.arch }}
          path: updater-assets/*
          if-no-files-found: error

  upload-server:
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shares the headless-v<version> release with Release Headless.
    concurrency:
      group: release-headless
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          pattern: server-*
          path: artifacts
      - name: Get Version
        id: get_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.headless.json
      - name: Check release before uploading packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: node scripts/publish-custom-updater.cjs --check "headless-v$VERSION" "$VERSION"
      - name: Upload server executables
        uses: softprops/action-gh-release@v3
        with:
          tag_name: headless-v${{ steps.get_version.outputs.VERSION }}
          name: 'RClone Manager Headless v${{ steps.get_version.outputs.VERSION }}'
          draft: true
          prerelease: ${{ steps.get_version.outputs.PRERELEASE }}
          files: |
            artifacts/**/*
            !artifacts/**/updater.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish custom update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: node scripts/publish-custom-updater.cjs "headless-v$VERSION" "$VERSION" artifacts

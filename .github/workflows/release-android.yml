name: 'Release Android'
on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install Rust stable and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          # Write environment variables to GITHUB_ENV so subsequent steps can read them
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Frontend Dependencies
        run: npm install

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build & Package Android APKs (Per Architecture)
        env:
          NDK_HOME: ${{ env.NDK_HOME }}
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          mkdir -p dist_apks

          TARGET_LIST=("aarch64:arm64-v8a" "armv7:armeabi-v7a" "x86_64:x86_64" "i686:x86")

          for item in "${TARGET_LIST[@]}"; do
            IFS=":" read -r target abi <<< "$item"
            echo "=========================================="
            echo "Building Android APK for $target ($abi)..."
            echo "=========================================="

            rm -rf src-tauri/gen/android/app/build/outputs/apk/
            npm run tauri android build -- --target "$target" --debug --features mobile -- --no-default-features

            apk_path=$(find src-tauri/gen/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
            if [ -f "$apk_path" ]; then
              out_name="RClone Manager_${VERSION}_${abi}-debug.apk"
              cp "$apk_path" "dist_apks/$out_name"
              echo "Successfully packaged: dist_apks/$out_name"
            else
              echo "Error: No APK found for target $target ($abi)"
              exit 1
            fi
          done

      - name: Upload Debug APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rclone-manager-android-apks
          path: dist_apks/*.apk

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: 'RClone Manager v${{ steps.get_version.outputs.VERSION }}'
          draft: true
          prerelease: false
          files: |
            dist_apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


name: 'Release Android'
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      prerelease: ${{ steps.get_version.outputs.PRERELEASE }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout rclone source code
        uses: actions/checkout@v7
        with:
          repository: 'rclone/rclone'
          path: 'rclone'
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install Rust stable and Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          # Write environment variables to GITHUB_ENV so subsequent steps can read them
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Get Version
        id: get_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json

      - name: Build Android APKs (Per Architecture)
        env:
          RCLONE_SRC_DIR: ${{ github.workspace }}/rclone
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          mkdir -p unsigned_apks

          TARGET_LIST=("aarch64:arm64-v8a" "armv7:armeabi-v7a" "x86_64:x86_64" "i686:x86")

          for item in "${TARGET_LIST[@]}"; do
            IFS=":" read -r target abi <<< "$item"
            echo "=========================================="
            echo "Building Android APK for $target ($abi)..."
            echo "=========================================="

            rm -rf backend/desktop/gen/android/app/build/outputs/apk/
            RUSTFLAGS="-C link-arg=-Wl,-z,max-page-size=16384" npm run tauri android build -- --target "$target" --features mobile -- --no-default-features

            apk_path=$(find backend/desktop/gen/android/app/build/outputs/apk/ -name "*.apk" | head -n 1)
            if [ -f "$apk_path" ]; then
              cp "$apk_path" "unsigned_apks/$abi.apk"
            else
              echo "::error::No APK found for target $target ($abi)"
              exit 1
            fi
          done

      # Keystore secrets are only exposed to this step, not to the build tooling above.
      - name: Sign APKs and create update manifests
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        shell: bash
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Production APK updates require the persistent release keystore."
            exit 1
          fi
          trap 'rm -f release.keystore' EXIT
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore

          APKSIGNER=$(find "$ANDROID_HOME/build-tools/" -name "apksigner" | head -n 1)
          mkdir -p dist_apks

          TARGET_LIST=("aarch64:arm64-v8a" "armv7:armeabi-v7a" "x86_64:x86_64" "i686:x86")

          for item in "${TARGET_LIST[@]}"; do
            IFS=":" read -r target abi <<< "$item"
            out_name="RClone Manager_${VERSION}_${abi}.apk"
            "$APKSIGNER" sign --ks release.keystore --ks-pass env:KEYSTORE_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS --out "dist_apks/$out_name" "unsigned_apks/$abi.apk"
            echo "Successfully signed & packaged: dist_apks/$out_name"
            node scripts/create-update-manifest.cjs android android "$target" "$VERSION" "dist_apks/$out_name" updater-assets
          done

      - name: Android updater unit tests
        working-directory: backend/desktop/gen/android
        run: ./gradlew :app:testArm64DebugUnitTest -x :app:rustBuildArm64Debug

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rclone-manager-android-apks
          path: updater-assets/*
          if-no-files-found: error

  upload-android:
    name: Publish Android APKs
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Portable publishes into the same updater.json. Serialize read/merge/upload.
    concurrency:
      group: publish-custom-updater-main
      cancel-in-progress: false
      queue: max
    env:
      VERSION: ${{ needs.build-android.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          name: rclone-manager-android-apks
          path: updater-assets

      - name: Check release before uploading APKs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-custom-updater.cjs --check "v$VERSION" "$VERSION"
      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build-android.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 'RClone Manager v${{ needs.build-android.outputs.version }}'
          draft: true
          prerelease: ${{ needs.build-android.outputs.prerelease }}
          files: updater-assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish custom update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-custom-updater.cjs "v$VERSION" "$VERSION" updater-assets

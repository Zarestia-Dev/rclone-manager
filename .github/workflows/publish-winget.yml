name: 'Publish to WinGet'

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Show the release tag and installers that would be submitted, without submitting to WinGet'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Resolve version
        id: resolve
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest"
          $tag = $release.tag_name
          Write-Host "Resolved release tag: $tag"
          $release.assets.name | Where-Object { $_ -match '\.msi$' } | ForEach-Object { Write-Host "Installer: $_" }
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          # winget-releaser only strips the 'v' when `version` is empty, so strip it here
          echo "VERSION=$($tag -replace '^v')" >> $env:GITHUB_OUTPUT

      - name: Submit to WinGet
        if: ${{ !inputs.dry_run }}
        # Pinned: this action receives WINGET_PAT. v2 at the time of pinning.
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54
        with:
          identifier: RClone-Manager.rclone-manager
          version: ${{ steps.resolve.outputs.VERSION }}
          release-tag: ${{ steps.resolve.outputs.TAG }}
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_PAT }}

name: "Release Desktop"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "ubuntu-22.04-arm"
            args: ""
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            rust_target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            rust_target: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./backend -> target"
          key: ${{ matrix.platform }}

      - name: install dependencies (ubuntu-22.04 x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libgtk-3-dev libxdo-dev libssl-dev \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            libwebkit2gtk-4.1-dev

      - name: install dependencies (ubuntu-22.04-arm)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      # The released CLI (2.12.4) cannot bundle an RPM for a SemVer pre-release such as
      # 0.3.6-beta.1; the fix (tauri-apps/tauri#16336) is on dev and not released yet.
      # TODO: once a tauri-cli newer than 2.12.4 is released (it contains a200fae13), delete this
      # step and the `tauriScript` input of tauri-apps/tauri-action below.
      - name: install tauri-cli with the RPM pre-release fix (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          cargo install tauri-cli \
            --git https://github.com/tauri-apps/tauri \
            --rev a200fae133970fc85a50c2ba30ac184769278d17 \
            --locked \
            --force
          echo "tauri-cli version: $(cargo tauri --version)"

      - name: install frontend dependencies
        run: npm ci

      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_FRONTEND_PATH: ${{ github.workspace }}
          TAURI_APP_PATH: ${{ github.workspace }}/backend/desktop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend/desktop
          # TODO: remove with the tauri-cli install step above (see its TODO).
          tauriScript: ${{ startsWith(matrix.platform, 'ubuntu') && 'cargo tauri' || '' }}
          uploadUpdaterSignatures: false
          tagName: v__VERSION__
          releaseName: "RClone Manager v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ steps.release_version.outputs.PRERELEASE }}
          args: ${{ matrix.args }} -- --locked

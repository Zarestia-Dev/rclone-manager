name: "Release Desktop"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
            arch: "aarch64"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
            arch: "x86_64"
          - platform: "ubuntu-22.04"
            args: ""
            arch: "x86_64"
          - platform: "ubuntu-22.04-arm"
            args: ""
            arch: "aarch64"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            rust_target: "x86_64-pc-windows-msvc"
            arch: "x86_64"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            rust_target: "aarch64-pc-windows-msvc"
            arch: "aarch64"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./backend -> target"
          key: ${{ matrix.platform }}

      - name: install dependencies (ubuntu-22.04 x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libgtk-3-dev libxdo-dev libssl-dev \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            libwebkit2gtk-4.1-dev

      - name: install dependencies (ubuntu-22.04-arm)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm ci

      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json

      # WiX takes only a numeric pre-release, so a beta's MSI carries its release's
      # version (0.3.7-beta.1 -> 0.3.7). The MSI allows downgrades, so the release
      # still installs over the beta. TAURI_CONFIG is merged into tauri.conf.json.
      - name: MSI version of a pre-release
        if: runner.os == 'Windows' && steps.release_version.outputs.PRERELEASE == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: echo "TAURI_CONFIG={\"bundle\":{\"windows\":{\"wix\":{\"version\":\"${VERSION%%-*}\"}}}}" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_FRONTEND_PATH: ${{ github.workspace }}
          TAURI_APP_PATH: ${{ github.workspace }}/backend/desktop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend/desktop
          uploadUpdaterSignatures: false
          tagName: v__VERSION__
          releaseName: "RClone Manager v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ steps.release_version.outputs.PRERELEASE }}
          args: ${{ matrix.args }} -- --locked

      # Up to v0.3.3 the AppImage forced GDK_BACKEND=x11 and bundled
      # libwayland-client, which left a blank window on Wayland sessions
      # (#146, #227). Both came from the bundler, so fail the draft release
      # if a bundler update brings either back.
      - name: Check AppImage for X11 forcing and bundled libwayland-client
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          shopt -s globstar nullglob
          images=(backend/target/**/bundle/appimage/*.AppImage)
          [ ${#images[@]} -gt 0 ] || { echo "::error::No AppImage was built"; exit 1; }
          status=0
          for image in "${images[@]}"; do
            work=$(mktemp -d)
            (cd "$work" && "$OLDPWD/$image" --appimage-extract >/dev/null)
            if grep -rqsE '^[[:space:]]*export GDK_BACKEND=x11' "$work/squashfs-root/AppRun" "$work/squashfs-root/apprun-hooks"; then
              echo "::error file=$image::AppRun forces GDK_BACKEND=x11"; status=1
            fi
            if [ -n "$(find "$work/squashfs-root" -name 'libwayland-client.so*' -print -quit)" ]; then
              echo "::error file=$image::bundles libwayland-client"; status=1
            fi
            rm -rf "$work"
          done
          exit $status

      # The core updater replaces the AppImage, DEB, RPM and Arch package from the
      # signed custom catalog. Each file is the payload, so its release asset is
      # signed as built. Tauri has no Arch bundle: it is made from the DEB's files.
      - name: Install nfpm
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NFPM: "2.49.0"
          UPDATE_ARCH: ${{ matrix.arch }}
        run: |
          case "$UPDATE_ARCH" in
            x86_64) asset=Linux_x86_64.tar.gz ;;
            aarch64) asset=Linux_arm64.tar.gz ;;
          esac
          dir="$RUNNER_TEMP/nfpm"
          gh release download "v$NFPM" -R goreleaser/nfpm -p "nfpm_${NFPM}_$asset" -p checksums.txt -D "$dir"
          (cd "$dir" && sha256sum --check --ignore-missing checksums.txt)
          tar -xzf "$dir/nfpm_${NFPM}_$asset" -C "$dir" nfpm
          echo "$dir" >> "$GITHUB_PATH"

      - name: Sign Linux packages for the custom updater
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: |
          shopt -s globstar nullglob
          images=(backend/target/**/bundle/appimage/*_"$UPDATE_VERSION"_*.AppImage)
          debs=(backend/target/**/bundle/deb/*.deb)
          rpms=(backend/target/**/bundle/rpm/*.rpm)
          [ ${#images[@]} -eq 1 ] || { echo "::error::Expected one AppImage, found ${#images[@]}"; exit 1; }
          [ ${#debs[@]} -eq 1 ] || { echo "::error::Expected one DEB, found ${#debs[@]}"; exit 1; }
          [ ${#rpms[@]} -eq 1 ] || { echo "::error::Expected one RPM, found ${#rpms[@]}"; exit 1; }
          node scripts/create-update-manifest.cjs appimage linux "$UPDATE_ARCH" "$UPDATE_VERSION" "${images[0]}" updater-catalog
          node scripts/create-update-manifest.cjs deb linux "$UPDATE_ARCH" "$UPDATE_VERSION" "${debs[0]}" updater-catalog
          node scripts/create-update-manifest.cjs rpm linux "$UPDATE_ARCH" "$UPDATE_VERSION" "${rpms[0]}" updater-catalog
          # The Arch package: the DEB's files (the metainfo copy the AUR package also
          # leaves out), with pacman's own version (no "-").
          stage=backend/target/package-desktop
          rm -rf "$stage"
          dpkg-deb -x "${debs[0]}" "$stage"
          rm -f "$stage/usr/share/flatpak.metainfo.xml"
          case "$UPDATE_ARCH" in x86_64) package_arch=amd64 ;; aarch64) package_arch=arm64 ;; esac
          mkdir -p packages
          archpkg="packages/RClone.Manager-$UPDATE_VERSION-1-$UPDATE_ARCH.pkg.tar.zst"
          VERSION="${UPDATE_VERSION//-/}" ARCH="$package_arch" nfpm package -f backend/desktop/linux/nfpm.yaml -p archlinux --target "$archpkg"
          node scripts/create-update-manifest.cjs pacman linux "$UPDATE_ARCH" "$UPDATE_VERSION" "$archpkg" updater-catalog
          # tauri-action uploaded the other files; the catalog is published once all
          # of its files are in the draft release.
          gh release upload "v$UPDATE_VERSION" "$archpkg"

      # The core updater runs the setup and the MSI. The MSI of a pre-release carries
      # its release's version, so the files are found by folder, not by version.
      - name: Sign Windows setup and MSI for the custom updater
        if: runner.os == 'Windows'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: |
          shopt -s globstar nullglob
          setups=(backend/target/**/bundle/nsis/*-setup.exe)
          msis=(backend/target/**/bundle/msi/*.msi)
          [ ${#setups[@]} -eq 1 ] || { echo "::error::Expected one setup, found ${#setups[@]}"; exit 1; }
          [ ${#msis[@]} -eq 1 ] || { echo "::error::Expected one MSI, found ${#msis[@]}"; exit 1; }
          node scripts/create-update-manifest.cjs nsis windows "$UPDATE_ARCH" "$UPDATE_VERSION" "${setups[0]}" updater-catalog
          node scripts/create-update-manifest.cjs msi windows "$UPDATE_ARCH" "$UPDATE_VERSION" "${msis[0]}" updater-catalog

      # The core updater replaces the whole app bundle, whose signature covers every
      # file in it, from a ZIP the way it does for a portable build. The ZIP is
      # uploaded here; the catalog is published once all of its files are in the
      # draft release.
      - name: Sign macOS app for the custom updater
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_TARGET: ${{ matrix.rust_target }}
          UPDATE_VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: |
          member='RClone Manager.app/Contents/MacOS/rclone-manager'
          app="backend/target/$UPDATE_TARGET/release/bundle/macos/RClone Manager.app"
          [ -d "$app" ] || { echo "::error::No app bundle was built"; exit 1; }
          mkdir -p updater-catalog
          archive="updater-catalog/app-macos-$UPDATE_ARCH-$UPDATE_VERSION.zip"
          ditto -c -k --norsrc --keepParent "$app" "$archive"
          node scripts/create-update-manifest.cjs app macos "$UPDATE_ARCH" "$UPDATE_VERSION" "$app/Contents/MacOS/rclone-manager" updater-catalog "$archive" "$member"
          gh release upload "v$UPDATE_VERSION" "$archive"

      - name: Collect update catalog
        uses: actions/upload-artifact@v7
        with:
          name: catalog-${{ runner.os }}-${{ matrix.arch }}
          path: updater-catalog/updater.json
          if-no-files-found: error

  publish-catalog:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Portable and Android publish into the same updater.json. Serialize read/merge/upload.
    concurrency:
      group: publish-custom-updater-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          pattern: catalog-*
          path: artifacts
      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json
      - name: Publish custom update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: node scripts/publish-custom-updater.cjs "v$VERSION" "$VERSION" artifacts

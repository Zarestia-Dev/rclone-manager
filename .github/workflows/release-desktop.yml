name: "Release Desktop"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            rust_target: "aarch64-apple-darwin"
          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            rust_target: "x86_64-apple-darwin"
          - platform: "ubuntu-22.04"
            args: ""
            arch: "x86_64"
          - platform: "ubuntu-22.04-arm"
            args: ""
            arch: "aarch64"
          - platform: "windows-latest"
            args: "--target x86_64-pc-windows-msvc"
            rust_target: "x86_64-pc-windows-msvc"
          - platform: "windows-11-arm"
            args: "--target aarch64-pc-windows-msvc"
            rust_target: "aarch64-pc-windows-msvc"

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: "npm"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./backend -> target"
          key: ${{ matrix.platform }}

      - name: install dependencies (ubuntu-22.04 x86_64)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libgtk-3-dev libxdo-dev libssl-dev \
            libappindicator3-dev librsvg2-dev patchelf xdg-utils \
            libwebkit2gtk-4.1-dev

      - name: install dependencies (ubuntu-22.04-arm)
        if: matrix.platform == 'ubuntu-22.04-arm'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm ci

      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json

      - uses: tauri-apps/tauri-action@v1
        env:
          TAURI_FRONTEND_PATH: ${{ github.workspace }}
          TAURI_APP_PATH: ${{ github.workspace }}/backend/desktop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend/desktop
          uploadUpdaterSignatures: false
          tagName: v__VERSION__
          releaseName: "RClone Manager v__VERSION__"
          releaseBody: "See the assets to download this version and install."
          releaseDraft: true
          prerelease: ${{ steps.release_version.outputs.PRERELEASE }}
          args: ${{ matrix.args }} -- --locked

      # Up to v0.3.3 the AppImage forced GDK_BACKEND=x11 and bundled
      # libwayland-client, which left a blank window on Wayland sessions
      # (#146, #227). Both came from the bundler, so fail the draft release
      # if a bundler update brings either back.
      - name: Check AppImage for X11 forcing and bundled libwayland-client
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        run: |
          shopt -s globstar nullglob
          images=(backend/target/**/bundle/appimage/*.AppImage)
          [ ${#images[@]} -gt 0 ] || { echo "::error::No AppImage was built"; exit 1; }
          status=0
          for image in "${images[@]}"; do
            work=$(mktemp -d)
            (cd "$work" && "$OLDPWD/$image" --appimage-extract >/dev/null)
            if grep -rqsE '^[[:space:]]*export GDK_BACKEND=x11' "$work/squashfs-root/AppRun" "$work/squashfs-root/apprun-hooks"; then
              echo "::error file=$image::AppRun forces GDK_BACKEND=x11"; status=1
            fi
            if [ -n "$(find "$work/squashfs-root" -name 'libwayland-client.so*' -print -quit)" ]; then
              echo "::error file=$image::bundles libwayland-client"; status=1
            fi
            rm -rf "$work"
          done
          exit $status

      # The core updater replaces AppImages from the signed custom catalog. The
      # AppImage itself is the payload, so its release asset is signed as built.
      - name: Sign AppImage for the custom updater
        if: startsWith(matrix.platform, 'ubuntu-')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATE_ARCH: ${{ matrix.arch }}
          UPDATE_VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: |
          shopt -s globstar nullglob
          images=(backend/target/**/bundle/appimage/*_"$UPDATE_VERSION"_*.AppImage)
          [ ${#images[@]} -eq 1 ] || { echo "::error::Expected one AppImage, found ${#images[@]}"; exit 1; }
          node scripts/create-update-manifest.cjs appimage linux "$UPDATE_ARCH" "$UPDATE_VERSION" "${images[0]}" updater-catalog

      - name: Collect AppImage update catalog
        if: startsWith(matrix.platform, 'ubuntu-')
        uses: actions/upload-artifact@v7
        with:
          name: appimage-linux-${{ matrix.arch }}
          path: updater-catalog/updater.json
          if-no-files-found: error

  publish-catalog:
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Portable and Android publish into the same updater.json. Serialize read/merge/upload.
    concurrency:
      group: publish-custom-updater-main
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - uses: actions/download-artifact@v8
        with:
          pattern: appimage-*
          path: artifacts
      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.json
      - name: Publish custom update catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release_version.outputs.VERSION }}
        run: node scripts/publish-custom-updater.cjs "v$VERSION" "$VERSION" artifacts

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx --no-install eslint "**/*.{ts,html}"
      - name: Formatting
        run: npx --no-install prettier --check "**/*.{ts,html,scss,json}" ".github/workflows/ci.yml"
      - name: Build without warnings
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qiE '(^|[^[:alpha:]])warning([^[:alpha:]]|$)' build.log; then
            echo "::error::Frontend build emitted warnings"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: browser-ui
          path: dist/rclone-manager/browser
          retention-days: 1
      - run: npm run test:ci
      - name: Release metadata and update manifest tests
        run: node --test scripts/create-update-manifest.test.cjs scripts/publish-custom-updater.test.cjs scripts/release-version.test.cjs scripts/aur-depends.test.cjs

  validate:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      # Type-check mobile FFI without building the external Go archive.
      LIBRCLONE_SKIP_LINK_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libayatana-appindicator3-dev             librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: No local dependency overrides
        if: runner.os == 'Linux'
        run: |
          if grep -nE '^\[patch' Cargo.toml; then
            echo "::error::Remove the temporary [patch] block from backend/Cargo.toml before merging"
            exit 1
          fi
      - name: Prepare frontend asset directory for type checks
        run: mkdir -p ../dist/rclone-manager/browser
      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Desktop and Portable
        run: |
          for features in desktop desktop,tray portable; do
            cargo clippy --locked -p rclone-manager --no-default-features --features "$features" -- -D warnings
          done
      - name: Web server
        run: cargo clippy --locked -p rclone-manager-server -- -D warnings
      - name: Linux and mobile variants
        if: runner.os == 'Linux'
        run: |
          for features in flatpak mobile; do
            cargo clippy --locked -p rclone-manager --no-default-features --features "$features" -- -D warnings
          done
      - name: Test code
        if: runner.os == 'Linux'
        run: |
          cargo clippy --locked -p rclone-manager-core --all-targets --features desktop,tray-gtk,notifications,autostart -- -D warnings
          cargo clippy --locked -p rclone-manager --all-targets --no-default-features --features desktop,tray,tauri-test -- -D warnings
      - name: Core and server unit tests
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p rclone-manager-core
          cargo test --locked -p rclone-manager-server --lib
      - name: Updater unit tests
        run: cargo test --locked -p rclone-manager-core --lib services::updates -- --test-threads=1
      - name: Native unit tests
        if: runner.os == 'Linux'
        run: |
          cargo test --locked -p rclone-manager-core --features desktop,tray-gtk,notifications,autostart --lib
          # Graphics tests mutate process environment variables.
          for features in desktop desktop,tray,tauri-test; do
            cargo test --locked -p rclone-manager --no-default-features --features "$features" --lib -- --test-threads=1
          done

  embedded-server:
    name: Embedded server UI
    needs: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: browser-ui
          path: dist/rclone-manager/browser
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          key: embedded-server
          save-if: ${{ github.event_name == 'push' }}
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libssl-dev pkg-config
      - run: cargo clippy --locked --release -p rclone-manager-server --all-targets -- -D warnings
      - run: cargo test --locked --release -p rclone-manager-server --lib

  android:
    name: Android target
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      LIBRCLONE_SKIP_LINK_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          key: android
          save-if: ${{ github.event_name == 'push' }}
      - name: Select NDK toolchain
        run: |
          echo "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          {
            echo "CC_x86_64_linux_android=x86_64-linux-android26-clang"
            echo "AR_x86_64_linux_android=llvm-ar"
            echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=x86_64-linux-android26-clang"
          } >> "$GITHUB_ENV"
      - name: Android mobile code
        run: |
          cargo clippy --locked -p rclone-manager-core --target x86_64-linux-android --features mobile -- -D warnings
          # The app crate too: code behind cfg(target_os = "android") or excluded from it only
          # compiles for this target.
          cargo clippy --locked -p rclone-manager --target x86_64-linux-android --no-default-features --features mobile -- -D warnings

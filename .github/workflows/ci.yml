name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npx --no-install eslint "**/*.{ts,html}"
      - name: Formatting
        run: npx --no-install prettier --check "**/*.{ts,html,scss,json}" ".github/workflows/ci.yml" ".github/workflows/security.yml" ".github/dependabot.yml"
      - name: Build without warnings
        shell: bash
        run: |
          npm run build 2>&1 | tee build.log
          if grep -qiE '(^|[^[:alpha:]])warning([^[:alpha:]]|$)' build.log; then
            echo "::error::Frontend build emitted warnings"
            exit 1
          fi
      - run: npm run test:ci

  validate:
    name: Check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: src-tauri
        shell: bash
    env:
      # Type-check mobile FFI without building the external Go archive.
      LIBRCLONE_SKIP_LINK_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          save-if: ${{ github.event_name == 'push' }}
      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev libayatana-appindicator3-dev             librsvg2-dev libxdo-dev libssl-dev patchelf
      - name: Prepare frontend asset directory for type checks
        run: mkdir -p ../dist/rclone-manager/browser
      - name: Rust formatting
        if: runner.os == 'Linux'
        run: cargo fmt -- --check
      - name: Desktop and Portable
        run: |
          for features in desktop desktop,tray portable; do
            cargo clippy --locked --no-default-features --features "$features" -- -D warnings
          done
      - name: Pure web server
        run: cargo clippy --locked --no-default-features --features web-server -- -D warnings
      - name: Web server with tray and updater
        run: |
          export TAURI_CONFIG="$(cat tauri.conf.headless.json)"
          cargo clippy --locked --no-default-features --features web-server,tray,updater -- -D warnings
      - name: Linux and mobile variants
        if: runner.os == 'Linux'
        run: |
          for features in flatpak mobile; do
            cargo clippy --locked --no-default-features --features "$features" -- -D warnings
          done
      - name: Server unit tests
        if: runner.os == 'Linux'
        run: cargo test --locked --no-default-features --features web-server --lib
      - name: Native unit tests
        if: runner.os == 'Linux'
        run: |
          # Graphics tests mutate process environment variables.
          for features in desktop desktop,tray,tauri-test; do
            cargo test --locked --no-default-features --features "$features" --lib -- --test-threads=1
          done

name: 'Release Headless'

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-headless
  cancel-in-progress: false
  queue: max

jobs:
  build-headless:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-22.04'
            args: '--target x86_64-unknown-linux-gnu'
            arch: 'x86_64'
            rust_target: 'x86_64-unknown-linux-gnu'
          - platform: 'ubuntu-22.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
            arch: 'aarch64'
            rust_target: 'aarch64-unknown-linux-gnu'
          - platform: 'windows-latest'
            args: '--target x86_64-pc-windows-msvc'
            arch: 'x86_64'
            rust_target: 'x86_64-pc-windows-msvc'
          - platform: 'windows-latest'
            args: '--target aarch64-pc-windows-msvc'
            arch: 'aarch64'
            rust_target: 'aarch64-pc-windows-msvc'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies (ubuntu only)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './backend -> target'
          key: headless-${{ runner.os }}-${{ matrix.arch }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Remove Tauri capabilities metadata
        shell: bash
        run: rm -rf backend/desktop/capabilities

      - name: Read release version
        id: release_version
        run: node scripts/release-version.cjs backend/desktop/tauri.conf.headless.json

      - name: Build and Release Headless
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_FRONTEND_PATH: ${{ github.workspace }}
          TAURI_APP_PATH: ${{ github.workspace }}/backend/desktop
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: backend/desktop
          uploadUpdaterSignatures: false
          tagName: headless-v__VERSION__
          releaseName: 'RClone Manager Headless v__VERSION__'
          releaseBody: 'RClone Manager Headless v__VERSION__'
          releaseDraft: true
          prerelease: ${{ steps.release_version.outputs.PRERELEASE }}
          args: >-
            --config tauri.conf.headless.json
            --features web-server,tray,updater
            ${{ matrix.args }}
            -- --locked --no-default-features

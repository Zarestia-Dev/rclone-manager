name: ⭐ Feature Request
description: Suggest an idea or enhancement for RClone Manager
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: checkboxes
    attributes:
      label: Pre-submission Checks
      description: Please verify these items before submitting.
      options:
        - label: I have searched open and closed issues to confirm this feature hasn't been requested before.
          required: true
        - label: I have checked the project roadmap / open PRs.
        - label: This feature aligns with RClone Manager's scope (Rclone management & file operations).

  - type: markdown
    attributes:
      value: |
        ### Thank you for suggesting a feature!
        Detailed feature requests help us evaluate feasibility and design effective user experiences.

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: |
        A clear and concise description of:
        - What problem this feature solves
        - Who would benefit from it
        - Current workarounds (if any)
      placeholder: |
        Example:
        Currently, on Android mobile devices, sharing a file directly into RClone Manager to upload to a remote requires several manual steps.
        Adding a system share target would allow 1-tap uploads to remote storage.
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: |
        How you envision this feature working:
        - UI / UX changes
        - Expected behavior
        - Alternatives considered
      placeholder: |
        Add an option in Android system share sheet for RClone Manager, opening a dialog to pick destination remote and path.
    validations:
      required: true

  - type: dropdown
    id: feature-category
    attributes:
      label: Feature Category
      options:
        - 'UI/UX Improvement'
        - 'New Remote Configuration'
        - 'File Management & Nautilus'
        - 'Sync/Copy Operations'
        - 'Mount & Serve (FUSE / WebDAV / SFTP / HTTP)'
        - 'Mobile / Android Specific'
        - 'Performance & System'
        - 'Security'
        - 'Other'
    validations:
      required: true

  - type: checkboxes
    id: applicable-platforms
    attributes:
      label: Applicable Platforms / Versions
      description: Which platform(s) or app modes would this feature apply to?
      options:
        - label: Desktop (Windows, macOS, Linux)
        - label: Android (Mobile)
        - label: Headless (Web server / NAS / VPS)
        - label: Portable (Standalone executable)
        - label: All platforms

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Screenshots
      description: Visual sketches, Figma/Excalidraw links, or UI comparisons.

  - type: textarea
    id: technical-details
    attributes:
      label: Technical Considerations
      description: |
        Any technical details:
        - Rclone flags or features required
        - Platform APIs or permissions (e.g. Android permissions, FUSE driver)
        - Performance or security considerations

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Anything else that might be helpful (similar apps, priority, links).

name: 🐛 Bug Report
description: File a bug report for RClone Manager
title: '[Bug]: '
labels: ['bug']
body:
  - type: checkboxes
    attributes:
      label: Pre-submission Checklist
      description: Please verify these items before submitting your issue.
      options:
        - label: I have searched existing issues (open and closed) to ensure this is not a duplicate.
          required: true
        - label: I am using the latest version of RClone Manager or have checked recent release notes.
          required: true

  - type: textarea
    id: the-problem
    attributes:
      label: Bug Description
      description: |
        A clear and concise description of the bug:
        - What you were trying to do
        - What actually happened
        - Any error messages displayed
      placeholder: |
        Example:
        When trying to sync my Google Drive remote on Android, the app crashes with error "Failed to initialize rclone config".
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: Select the OS where the issue occurred.
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: The specific version of your operating system.
      placeholder: e.g., Windows 11 23H2, macOS 14.4, Ubuntu 24.04, Android 14 / One UI 6.0
    validations:
      required: true

  - type: dropdown
    id: architecture
    attributes:
      label: Architecture / CPU
      description: System architecture or processor type.
      options:
        - x86_64 (64-bit Intel/AMD)
        - arm64 / aarch64 (Apple Silicon / ARM64 Android)
        - armv7 (32-bit ARM)
        - x86 (32-bit Intel/AMD)
        - Other / Unknown

  - type: dropdown
    id: app-version-type
    attributes:
      label: App Version Type
      description: Which build / mode of RClone Manager are you using?
      options:
        - Desktop (GUI application window)
        - Android (Mobile APK)
        - Headless (Web server accessed via browser)
        - Portable (Standalone binary)
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version Number
      description: Version of RClone Manager you are using.
      placeholder: e.g., 1.2.0 or commit hash if building from source
    validations:
      required: true

  - type: input
    id: rclone-version
    attributes:
      label: RClone Version
      description: Version of RClone installed or used by the app.
      placeholder: e.g., rclone v1.74.0 (or "Bundled")

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Open RClone Manager
        2. Tap / Click on 'Add Remote'
        3. Select 'Google Drive'
        4. See error "Connection timeout"
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A clear description of what you expected to happen.
      placeholder: The app should connect to Google Drive and display the remote directory structure.

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs & Output
      description: |
        Please provide relevant logs if available:
        - Developer Console logs (Desktop / Web)
        - Logcat / App logs (Android)
        - RClone debug logs (`rclone -vv` output)
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Screen Recordings
      description: Add screenshots or screen recordings to help demonstrate the issue.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: |
        Any other relevant details (e.g., specific remote types, network conditions, custom rclone.conf settings).

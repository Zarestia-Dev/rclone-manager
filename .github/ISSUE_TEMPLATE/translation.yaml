name: 🌍 Translation
description: Add a new language translation or update an existing one
title: '[i18n]: Add/Update LANGUAGE_NAME translation'
labels: ['i18n', 'translation']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing a translation! Please refer to the [Translation Guide](https://github.com/Zarestia-Dev/rclone-manager/blob/main/CONTRIBUTING.md#adding-translations) or join our [Crowdin Project](https://crowdin.com/project/rclone-manger).

  - type: input
    id: language-code
    attributes:
      label: Language Code (BCP-47)
      description: The BCP-47 language tag for your translation (e.g., de-DE, fr-FR, ja-JP, tr-TR)
      placeholder: de-DE
    validations:
      required: true

  - type: input
    id: language-name
    attributes:
      label: Language Name (Native)
      description: The language name as it should appear in the app selector, in its native script
      placeholder: Deutsch (Deutschland)
    validations:
      required: true

  - type: dropdown
    id: translation-type
    attributes:
      label: Translation Type
      description: Is this a new translation or an update to an existing translation?
      options:
        - New translation
        - Update / fix existing translation
    validations:
      required: true

  - type: textarea
    id: translation-coverage
    attributes:
      label: Translation Coverage
      description: If this is a partial translation, list completed and pending sections.
      placeholder: |
        - ✅ Common UI strings
        - ✅ Settings & Configuration
        - ✅ Nautilus File Manager
        - ✅ Error messages

  - type: checkboxes
    id: checklist
    attributes:
      label: Translation Checklist
      description: Please confirm you have completed these steps.
      options:
        - label: Created or updated translation file in `resources/i18n/` / `src/assets/i18n/`
          required: true
        - label: Registered language code and native name in schema / configuration
          required: true
        - label: Tested translation live in the application UI
          required: true
        - label: Preserved all `{{placeholder}}` variables intact
          required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional screenshots demonstrating the translated UI.

  - type: textarea
    id: notes
    attributes:
      label: Additional Notes
      description: Context on terminology choices, formal/informal register, or regional variations.

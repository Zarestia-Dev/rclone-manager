<div
  class="general-overview"
  data-tone="purple"
  animate.enter="fade-in-out-enter"
  animate.leave="fade-in-out-leave"
>
  <header class="overview-header">
    <app-overview-header
      [mode]="'general'"
      (openBackendModal)="openBackendModal.emit()"
      (toggleEditLayout)="panels.toggleEditLayout()"
    >
    </app-overview-header>
  </header>

  <div class="overview-content" role="main">
    <app-overview-panels
      #panels
      [layout]="layout"
      (layoutReset)="onLayoutReset()"
      (panelReset)="resetRemoteLayout()"
    >
      <ng-template appOverviewPanel="remotes" let-open let-setOpen="setOpen">
        <app-remotes-panel
          [title]="'generalOverview.panels.remotes' | translate"
          [icon]="'cloud'"
          [isActive]="true"
          [remotes]="remoteFacade.orderedVisibleRemotes()"
          [allRemotes]="remoteFacade.orderedRemotes()"
          [hiddenRemoteNames]="remoteFacade.hiddenRemoteNames()"
          [isEditingLayout]="isEditingLayout()"
          [mode]="'general'"
          [displayMode]="cardDisplayMode()"
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          (remoteSelected)="selectRemote.emit($event)"
          (openInFiles)="browseRemote.emit($event)"
          (layoutChanged)="remoteFacade.saveCurrentLayout(backendService.activeBackend(), $event)"
          (toggleHidden)="
            remoteFacade.toggleRemoteVisibility(backendService.activeBackend(), $event)
          "
          (startJob)="startJob.emit($event)"
          (stopJob)="stopJob.emit($event)"
          role="region"
          [attr.aria-label]="'generalOverview.panels.remotes' | translate"
        >
        </app-remotes-panel>
      </ng-template>
      <ng-template appOverviewPanel="bandwidth" let-open let-setOpen="setOpen">
        <app-bandwidth-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
        ></app-bandwidth-overview-panel>
      </ng-template>
      <ng-template appOverviewPanel="system" let-open let-setOpen="setOpen">
        <app-system-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          [totalCount]="totalRemotes()"
          [activeJobsCount]="activeJobsCount()"
        ></app-system-overview-panel>
      </ng-template>
      <ng-template appOverviewPanel="jobs" let-open let-setOpen="setOpen">
        <app-jobs-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          [showFilterChips]="true"
        ></app-jobs-overview-panel>
      </ng-template>
      <ng-template appOverviewPanel="automations" let-open let-setOpen="setOpen">
        <app-automations-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          [defaultOriginFilter]="'dashboard'"
          [showFilterChips]="true"
          (automationClick)="onAutomationClick($event)"
        ></app-automations-overview-panel>
      </ng-template>
      <ng-template appOverviewPanel="mounts" let-open let-setOpen="setOpen">
        <app-mounts-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          [defaultOriginFilter]="'dashboard'"
          [showFilterChips]="true"
        ></app-mounts-overview-panel>
      </ng-template>
      <ng-template appOverviewPanel="serves" let-open let-setOpen="setOpen">
        <app-serves-overview-panel
          [expanded]="open"
          (expandedChange)="setOpen($event)"
          [defaultOriginFilter]="'dashboard'"
          [showFilterChips]="true"
          (serveClick)="handleServeCardClick($event)"
          (stopServe)="stopServe($event)"
        ></app-serves-overview-panel>
      </ng-template>
    </app-overview-panels>
  </div>
</div>

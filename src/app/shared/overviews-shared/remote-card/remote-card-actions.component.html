<div class="quick-actions">
  @for (button of actionButtons(); track button.id) {
    @let picker = profilePickers()[button.id];
    @if (picker) {
      <ng-template #profileMenu>
        <div cdkMenu class="material-context-menu has-caret">
          @for (entry of picker.entries; track entry.profile) {
            <button
              cdkMenuItem
              class="menu-item"
              [attr.data-tone]="entry.isActive ? 'warn' : entry.tone"
              data-variant="solid"
              [disabled]="entry.isBusy"
              (click)="onPick(entry.operation, entry.profile, $event)"
            >
              @if (entry.isBusy) {
                <mat-icon svgIcon="spinner"></mat-icon>
              } @else {
                <mat-icon [svgIcon]="entry.isActive ? entry.stopIcon : entry.startIcon"></mat-icon>
              }
              <span>{{ entry.profile }}</span>
            </button>
          }
        </div>
      </ng-template>

      <button
        matMiniFab
        [attr.data-tone]="picker.isActive ? 'warn' : picker.tone"
        [attr.title]="picker.triggerTooltipKey | translate"
        [cdkMenuTriggerFor]="profileMenu"
        [cdkMenuPosition]="[
          {
            originX: 'center',
            originY: 'top',
            overlayX: 'center',
            overlayY: 'bottom',
            offsetY: -8,
          },
        ]"
        (click)="$event.stopPropagation()"
      >
        @if (picker.isBusy) {
          <mat-icon svgIcon="spinner"></mat-icon>
        } @else {
          <mat-icon [svgIcon]="picker.triggerIcon"></mat-icon>
        }
        <span appPill="solid" size="xs" tone="accent" class="folder-badge" aria-hidden="true">
          {{ picker.entries.length }}
        </span>
      </button>
    } @else {
      <button
        matMiniFab
        [attr.title]="
          (button.tooltipKey | translate) +
          (button.tooltipProfile ? ' (' + button.tooltipProfile + ')' : '')
        "
        [disabled]="button.isDisabled"
        [attr.data-tone]="button.tone"
        (click)="onAction(button.id, $event)"
      >
        @if (button.isLoading) {
          <mat-icon svgIcon="spinner"></mat-icon>
        } @else {
          <mat-icon [svgIcon]="button.icon"></mat-icon>
        }
      </button>
    }
  }

  <app-folder-browse-button [folders]="openableFolders()" (open)="openFolder.emit($event)" />
</div>

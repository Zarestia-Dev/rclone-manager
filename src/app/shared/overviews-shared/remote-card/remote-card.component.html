@if (isEditingLayout()) {
  <div
    class="card-edit-overlay"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    role="presentation"
  >
    <mat-icon svgIcon="drag-indicator" class="drag-handle"></mat-icon>
    <button
      class="hide-btn"
      [attr.title]="(isHidden() ? 'shared.actions.show' : 'shared.actions.hide') | translate"
      (click)="onToggleHidden($event)"
    >
      <mat-icon [svgIcon]="isHidden() ? 'eye' : 'eye-slash'"></mat-icon>
    </button>
  </div>
}

<div class="card-header" [ngClass]="'display-' + displayMode()">
  <div class="card-info">
    <div class="icon-container">
      <mat-icon
        [svgIcon]="iconService.getIconName(remote().type)"
        class="card-type-icon"
      ></mat-icon>
    </div>
    <div class="card-details">
      <h4 class="card-name" [attr.title]="remote().name">
        {{ remote().name }}
      </h4>
      <span class="card-meta">{{ remote().type | titlecase }}</span>
    </div>
  </div>

  <div class="card-status-indicators" aria-hidden="true">
    @for (vm of statusIndicatorViewModels(); track $index) {
      <div
        [class]="
          'app-pill ' +
          vm.meta.pillClass +
          (vm.meta.animateContainer ? ' ' + ACTION_ANIMATION_CLASS[vm.op] : '')
        "
        [attr.title]="vm.tooltip"
      >
        <mat-icon
          [svgIcon]="vm.meta.icon"
          [class]="vm.meta.animateContainer ? '' : ACTION_ANIMATION_CLASS[vm.op]"
          [attr.aria-label]="vm.meta.ariaKey | translate"
        ></mat-icon>
      </div>
    }
  </div>
</div>

@if (displayMode() === 'compact') {
  <app-remote-card-actions
    [actionButtons]="actionButtons()"
    [profilePickerGroupByOp]="profilePickerGroupByOp()"
    [openableFolders]="openableFolders()"
    [folderBlossomStyle]="folderBlossomStyle()"
    [isFolderOpening]="isFolderOpening()"
    (actionClick)="onActionButtonClick($event)"
    (profilePickerClick)="onProfilePickerClick($event.operation, $event.profile, $event.event)"
    (openFolderClick)="onOpenFolderClick($event.folder, $event.event)"
  />
}

@if (displayMode() === 'detailed') {
  <app-remote-card-profile-details
    [detailedOperations]="detailedOperations()"
    [detailedOperationViewModels]="detailedOperationViewModels()"
    (profileChipClick)="onProfileChipClick($event.operation, $event.profile, $event.event)"
    (profileOpenInFiles)="
      onProfileOpenInFiles($event.operation, $event.profile, $event.path, $event.event)
    "
  />
}

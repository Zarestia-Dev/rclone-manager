<div class="origin-filter-row">
  <button
    type="button"
    appPill
    [selected]="selected() === 'all'"
    (click)="selected.set('all')"
    [attr.title]="'common.all' | translate"
  >
    <span>{{ 'common.all' | translate }}</span>
  </button>
  <button
    type="button"
    appPill
    [selected]="selected() === 'workflow'"
    (click)="selected.set('workflow')"
    [attr.title]="'flow.tabs.workflow' | translate"
  >
    <mat-icon svgIcon="workflow"></mat-icon>
    <span>{{ 'flow.tabs.workflow' | translate }}</span>
  </button>
  <button
    type="button"
    appPill
    [selected]="selected() === 'quickrun'"
    (click)="selected.set('quickrun')"
    [attr.title]="'flow.tabs.quickRun' | translate"
  >
    <mat-icon svgIcon="quick-run"></mat-icon>
    <span>{{ 'flow.tabs.quickRun' | translate }}</span>
  </button>
  <button
    type="button"
    appPill
    [selected]="selected() === 'dashboard'"
    (click)="selected.set('dashboard')"
    [attr.title]="'navigation.dashboard' | translate"
  >
    <mat-icon svgIcon="cloud"></mat-icon>
    <span>{{ 'navigation.dashboard' | translate }}</span>
  </button>
</div>

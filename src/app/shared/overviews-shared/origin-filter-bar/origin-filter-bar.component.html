<div class="origin-filter-row">
  <button
    type="button"
    appPill
    [selected]="selected() === 'all'"
    (click)="selected.set('all')"
    [attr.title]="'common.all' | translate"
  >
    <span>{{ 'common.all' | translate }}</span>
  </button>
  @for (chip of chips; track chip.origin) {
    <button
      type="button"
      appPill
      [selected]="selected() === chip.origin"
      (click)="selected.set(chip.origin)"
      [attr.title]="chip.labelKey | translate"
    >
      <mat-icon [svgIcon]="chip.icon"></mat-icon>
      <span>{{ chip.labelKey | translate }}</span>
    </button>
  }
  @if (hiddenCount() > 0) {
    <button
      type="button"
      appPill
      tone="orange"
      class="ml-auto"
      (click)="selected.set('all')"
      [attr.title]="'generalOverview.originFilter.showAll' | translate"
    >
      <span>{{ 'generalOverview.originFilter.hidden' | translate: { count: hiddenCount() } }}</span>
    </button>
  }
</div>

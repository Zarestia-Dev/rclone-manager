@if (infoBanner(); as banner) {
  <app-alert-banner severity="info" [description]="banner | translate" />
}

<div class="chips-row" aria-label="Config fields overview">
  @if (chips().length === 0) {
    <span class="chips-empty">
      {{ 'shared.jsonEditor.noFields' | translate }}
    </span>
  }

  @for (chip of chips(); track chip.controlKey) {
    <span
      class="app-pill interactive"
      [class.p-primary]="chip.isActive"
      [class.p-accent]="chip.isChanged"
      [class.p-dim]="!chip.isActive"
      [attr.title]="
        chip.field.Name
          | rcloneOptionTranslate
            : 'help'
            : chip.field.Help || chip.displayKey + ': ' + chip.fullValue
            : provider() || chip.field.Provider
            : translateService.currentLang()
      "
      (click)="toggleChip(chip)"
      role="button"
      tabindex="0"
      (keydown.enter)="toggleChip(chip)"
      (keydown.space)="toggleChip(chip); $event.preventDefault()"
    >
      <span>{{ chip.displayKey }}</span>
    </span>
  }
</div>

<div #editorContainer class="code-mirror"></div>

@if (parseError(); as err) {
  <app-alert-banner severity="error" [description]="err.key | translate: err.params" />
}

@if (parseWarning(); as warn) {
  <app-alert-banner severity="warning" [description]="warn.key | translate: warn.params" />
}

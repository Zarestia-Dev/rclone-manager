<mat-card class="mount-card" [attr.data-tone]="tone" (click)="cardClick.emit(mount())">
  <!-- The card's main action; its buttons sit beside it (see _card-primary-action.scss). -->
  <button type="button" class="card-primary-action" [attr.aria-label]="remoteName()"></button>
  <div class="mount-body">
    <div class="mount-icon-wrap">
      <mat-icon svgIcon="mount" aria-hidden="true"></mat-icon>
    </div>

    <div class="mount-details">
      <div class="mount-title-row">
        <span class="mount-remote-name truncate">{{ remoteName() }}</span>
        <app-starter-pill [starter]="mount().starter" />
      </div>

      <span
        class="mount-point truncate"
        [attr.title]="'shared.mountCard.copyPath' | translate"
        [appCopyToClipboard]="mount().mount_point"
        >{{ mount().mount_point }}</span
      >
      <span class="mount-fs truncate">{{ mount().fs }}</span>
      @if (mount().mount_type || mountedOn()) {
        <div class="mount-meta">
          @if (mount().mount_type; as type) {
            <span
              appPill
              tone="dim"
              size="xs"
              [attr.title]="'shared.mountCard.mountType' | translate"
              >{{ type }}</span
            >
          }
          @if (mountedOn(); as time) {
            <span
              appPill
              tone="dim"
              size="xs"
              [attr.title]="'shared.mountCard.mountedOn' | translate"
            >
              <mat-icon svgIcon="clock" aria-hidden="true"></mat-icon>
              <span class="truncate">{{ time }}</span>
            </span>
          }
        </div>
      }
    </div>

    <div class="mount-actions">
      <button
        class="action-button"
        (click)="openMount.emit(mount()); $event.stopPropagation()"
        [attr.title]="'shared.mountCard.open' | translate"
      >
        <mat-icon svgIcon="folder-open"></mat-icon>
      </button>
      <button
        class="action-button"
        data-tone="warn"
        (click)="unmount.emit(mount()); $event.stopPropagation()"
        [attr.title]="'shared.mountCard.unmount' | translate"
      >
        <mat-icon svgIcon="eject"></mat-icon>
      </button>
    </div>
  </div>
</mat-card>

<div class="card-header">
  <div class="card-info">
    <div class="icon-container">
      <mat-icon [svgIcon]="icon()" class="card-type-icon" [class]="animationClass()"></mat-icon>
    </div>
    <div class="card-details">
      <h4 class="card-name truncate" [attr.title]="quickRun().name">
        {{ quickRun().name }}
      </h4>
      <span class="card-meta">
        <span class="op-badge">{{ actionLabel() | translate }}</span>
        <span>·</span>
        <button
          type="button"
          class="remote-link-btn"
          [class.is-missing]="isRemoteMissing()"
          (click)="onRemoteNameClick($event)"
          [attr.title]="
            (isRemoteMissing()
              ? ('flow.quickRun.badges.missingRemote' | translate)
              : ('dashboard.appDetail.remoteSettings' | translate)) +
            ': ' +
            quickRun().remoteName
          "
        >
          <mat-icon [svgIcon]="isRemoteMissing() ? 'warning' : remoteIcon()"></mat-icon>
          <span class="remote-name-text truncate">{{ quickRun().remoteName }}</span>
        </button>
      </span>
    </div>
  </div>

  <div class="card-status-indicators" aria-hidden="true">
    @if (appConfig().cronEnabled && appConfig().cronExpression; as expr) {
      <div
        appPill
        size="sm"
        tone="primary"
        [attr.title]="('flow.quickRun.badges.scheduled' | translate) + ': ' + expr"
      >
        <mat-icon svgIcon="clock"></mat-icon>
      </div>
    }
    @if (appConfig().watchEnabled) {
      <div
        appPill
        size="sm"
        tone="accent"
        [attr.title]="
          (appConfig().watchChangedOnly
            ? 'flow.quickRun.badges.watcherChangedOnly'
            : 'flow.quickRun.badges.watcher'
          ) | translate
        "
      >
        <mat-icon svgIcon="eye"></mat-icon>
      </div>
    }
    @if (appConfig().autoStart) {
      <div
        appPill
        size="sm"
        tone="yellow"
        [attr.title]="'flow.quickRun.badges.autostart' | translate"
      >
        <mat-icon svgIcon="bolt"></mat-icon>
      </div>
    }
  </div>
</div>

@if (quickRun().description) {
  <span class="description-text">{{ quickRun().description }}</span>
}

<div class="quick-actions">
  <!-- Primary Start / Stop Action -->
  <button
    matMiniFab
    [attr.data-tone]="isRunning() ? 'warn' : cardTone()"
    [disabled]="isActionInProgress() || isRemoteMissing()"
    [attr.title]="primaryTitle().key | translate: primaryTitle().params"
    (click)="onToggleRun($event)"
  >
    @if (isActionInProgress()) {
      <mat-icon svgIcon="spinner"></mat-icon>
    } @else {
      <mat-icon [svgIcon]="currentActionIcon()"></mat-icon>
    }
  </button>

  <button matMiniFab [attr.title]="'common.edit' | translate" (click)="onEdit($event)">
    <mat-icon svgIcon="pen"></mat-icon>
  </button>

  <app-folder-browse-button [folders]="browseTargets()" (open)="onOpenFolder($event)" />
</div>

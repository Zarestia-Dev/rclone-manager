<div
  #minimapCard
  class="workflow-minimap-card"
  [style.width.px]="mapWidth"
  [style.height.px]="mapHeight"
  (pointerdown)="onMinimapPointerDown($event)"
>
  <!-- Mini Wires Layer -->
  @if (scaledEdges().length > 0) {
    <svg class="mini-wires-layer">
      @for (w of scaledEdges(); track w.id) {
        <line
          [attr.x1]="w.x1"
          [attr.y1]="w.y1"
          [attr.x2]="w.x2"
          [attr.y2]="w.y2"
          class="mini-wire"
        />
      }
    </svg>
  }

  <!-- Viewport Camera Box. Top of the nodes so we can see the node names when we are hover the mini nodes -->
  <div
    class="mini-viewport"
    [style.left.px]="viewportRect().x"
    [style.top.px]="viewportRect().y"
    [style.width.px]="viewportRect().width"
    [style.height.px]="viewportRect().height"
  ></div>

  <!-- Mini Nodes -->
  @for (n of scaledNodes(); track n.id) {
    <div
      class="mini-node"
      [attr.data-tone]="n.tone"
      [attr.data-state]="n.state"
      [class.selected]="selectedNodeIds().has(n.id)"
      [style.left.px]="n.x"
      [style.top.px]="n.y"
      [style.width.px]="n.width"
      [style.height.px]="n.height"
      [attr.title]="n.title"
    ></div>
  }
</div>

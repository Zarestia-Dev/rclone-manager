<div class="left-section">
  <!-- Main Buttons -->
  <button
    matIconButton
    [cdkMenuTriggerFor]="addRemoteMenu"
    [attr.aria-label]="'titlebar.addRemoteMenu' | translate"
    data-tauri-drag-region="false"
  >
    <mat-icon svgIcon="plus" aria-hidden="true"></mat-icon>
  </button>

  <div class="contextual-action-wrapper" [class.visible]="uiStateService.selectedRemote()">
    <button
      matIconButton
      (click)="resetRemote()"
      [attr.aria-label]="'titlebar.home' | translate"
      data-tauri-drag-region="false"
    >
      <mat-icon svgIcon="rclone" aria-hidden="true"></mat-icon>
    </button>
  </div>

  <!-- Connection Status Indicator -->
  @if (connectionService.status() === 'offline' || connectionService.status() === 'checking') {
    <button
      matIconButton
      (click)="connectionService.runInternetCheck()"
      [disabled]="connectionService.status() === 'checking'"
      [attr.aria-label]="'titlebar.internetStatus' | translate"
      [attr.title]="connectionService.getTooltip()"
      data-tauri-drag-region="false"
    >
      @if (connectionService.status() !== 'checking') {
        <mat-icon svgIcon="no-internet" aria-hidden="true"></mat-icon>
      } @else {
        <mat-icon svgIcon="spinner" class="colorful-spinner"></mat-icon>
      }
    </button>
  }
</div>

<div class="right-section">
  <!-- App Menu -->
  <app-menu></app-menu>

  @if (mainUiOverlayService.isMainUiOverlayOpen()) {
    @if (!isMobile()) {
      <button
        matIconButton
        (click)="mainUiOverlayService.detachToStandaloneWindow()"
        [attr.aria-label]="'nautilus.contextMenu.openNewWindow' | translate"
        [attr.title]="'nautilus.contextMenu.openNewWindow' | translate"
        data-tauri-drag-region="false"
      >
        <mat-icon svgIcon="open-link" aria-hidden="true"></mat-icon>
      </button>
    }
    <button
      matIconButton
      (click)="mainUiOverlayService.closeMainUiOverlay()"
      [attr.aria-label]="'common.close' | translate"
      data-tauri-drag-region="false"
    >
      <mat-icon svgIcon="circle-xmark" aria-hidden="true"></mat-icon>
    </button>
  } @else {
    <!-- Window Controls -->
    <app-window-controls></app-window-controls>
  }
</div>

<!-- Add Remote Menu -->
<ng-template #addRemoteMenu>
  <div cdkMenu class="material-context-menu" xPosition="before">
    @for (item of addRemoteMenuItems; track item.label) {
      <button
        cdkMenuItem
        class="menu-item"
        (click)="item.action()"
        [attr.aria-label]="item.label | translate"
      >
        <span>{{ item.label | translate }}</span>
        <span class="shortcut" aria-hidden="true">{{ item.shortcut }}</span>
      </button>
    }
  </div>
</ng-template>

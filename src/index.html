<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RClone Manager</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#222226" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Web-based rclone management interface" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="assets/icons/pwa-192x192.png" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    />
  </head>

  <body class="mat-typography">
    <app-root>
      <div id="splash-preloader" aria-hidden="true">
        <style>
          #splash-preloader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fafafb;
            z-index: 999999;
          }
          @media (prefers-color-scheme: dark) {
            #splash-preloader {
              background-color: #222226;
            }
          }
          #splash-preloader .splash-logo {
            width: 128px;
            height: 128px;
            overflow: visible;
          }
        </style>
        <img src="assets/rclone-animated.svg" class="splash-logo" alt="RClone Manager" />
      </div>
    </app-root>
    <script>
      if ('serviceWorker' in navigator && !window.__TAURI_INTERNALS__) {
        navigator.serviceWorker.register('/sw.js').catch(() => {});
      }
    </script>
  </body>
</html>

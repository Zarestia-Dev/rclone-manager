# =============================================================================
# RClone Manager — Docker Compose
# =============================================================================
# Quick start:
#   docker compose up -d
#   Open http://localhost:8080
#
# For advanced configuration (auth, TLS, host networking):
#   https://hakanismail.info/zarestia/rclone-manager/docs/configuration-headless
# =============================================================================

services:
  rclone-manager:
    image: ghcr.io/zarestia-dev/rclone-manager:latest
    container_name: rclone-manager
    restart: unless-stopped

    ports:
      - '8080:8080'
      # Do NOT publish 53682 for OAuth: rclone's OAuth callback server listens on
      # the container's 127.0.0.1 only, so a port mapping cannot reach it.
      # For cloud remotes (Google Drive, OneDrive, Dropbox, etc.) either use
      # 'network_mode: host' (see below), or answer 'No' to the browser question
      # and paste a token made by 'rclone authorize' on another machine.

    volumes:
      - rclone-data:/data # App data & rclone binary (auto-downloaded on first run)
      - rclone-config:/config # rclone.conf

    environment:
      # Match these to your host user to avoid permission issues on mounted volumes.
      # Run 'id' in your terminal to find your UID/GID.
      - PUID=1000
      - PGID=1000
      # - PGIDS=1000,3000 # Optional: Supplementary group IDs (comma-separated) for NFSv4 ACLs / ZFS mounts

      # --- Optional: Master Secret / rcman Encrypted Credentials ---
      # Master password for rcman encrypted credentials store (remote passwords, tokens).
      # Optional: containers have no OS keyring, so without it secrets are kept in memory
      # only and must be re-entered after every restart. Set it to persist them.
      # - RCLONE_MANAGER_SECRET=MySuperSecretPassword123!
      # - RCLONE_MANAGER_SECRET_PATH=/data/.secret # Path to secret file (must exist before starting container)

      # --- Optional: Basic Authentication ---
      # Uncomment and fill in to password-protect the web UI.
      # Most users behind a reverse proxy (NPM, Traefik) don't need this.
      # - RCLONE_MANAGER_USER=admin
      # - RCLONE_MANAGER_PASS=changeme

      # --- Optional: HTTPS/TLS ---
      # Mount your certs and uncomment these to enable HTTPS directly.
      # - RCLONE_MANAGER_TLS_CERT=/app/certs/cert.pem
      # - RCLONE_MANAGER_TLS_KEY=/app/certs/key.pem

    # --- Optional: TLS cert volume ---
    # Uncomment if using the TLS options above.
    # volumes:
    #   - ./certs:/app/certs:ro

    # --- Optional: Host networking ---
    # Uncomment to fix OAuth browser authentication (Google Drive, OneDrive, etc.)
    # When enabled, remove the 'ports' section above — it's not needed — and set
    # RCLONE_MANAGER_PORT if 8080 is already used on the host.
    # The browser must reach the host's 127.0.0.1:53682. On a remote server, forward it:
    #   ssh -L 8080:127.0.0.1:8080 -L 53682:127.0.0.1:53682 user@your-server
    # network_mode: host

    # --- Optional: FUSE Mounting on Host ---
    # Uncomment if you want to mount cloud remotes directly to your host filesystem from inside Docker.
    # Note: To propagate mounts to the host, bind-mount a host folder with 'rshared' propagation.
    # devices:
    #   - /dev/fuse:/dev/fuse
    # cap_add:
    #   - SYS_ADMIN
    # security_opt:
    #   - apparmor:unconfined
    # volumes:
    #   - /mnt/remotes:/mnt/remotes:rshared

    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  rclone-data:
    name: rclone-manager-data
  rclone-config:
    name: rclone-manager-config
